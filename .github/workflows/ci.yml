name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-rust:
    name: Rust — test, clippy, audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build benchmarks (compile check)
        run: cargo bench --no-run

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  load-test:
    name: Rust — load tests
    runs-on: windows-latest
    needs: test-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run load tests
        run: cargo test -p palmsync-networking --test load_tests -- --ignored --nocapture

  test-cpp:
    name: C++ Eye — build & gesture tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (tests only — no OpenCV needed)
        run: cmake -S eye -B eye-build -DPALMSYNC_BUILD_APP=OFF -DBUILD_TESTS=ON

      - name: Build test target
        run: cmake --build eye-build --config Release --target palmsync-eye-tests

      - name: Run gesture tests
        run: eye-build/Release/palmsync-eye-tests.exe

  test-ui:
    name: C# UI — build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build UI
        run: dotnet build ui/PalmSync.Tray.csproj -c Release
