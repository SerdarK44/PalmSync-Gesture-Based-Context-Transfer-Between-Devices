[workspace]
resolver = "2"
members = [
    "shared",
    "networking",
    "brain",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SerdarK44"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
url = ">=2.0, <2.5"
fern = "0.7"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
